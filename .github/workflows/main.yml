
name: Build Iraq Ludo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game project
        run: |
          unzip -q IraqLudo-Android-updated.zip -d extracted

      - name: Build game assets
        working-directory: extracted/IraqLudo-Android
        run: bash web/build.sh

      - name: Build APK
        working-directory: extracted/IraqLudo-Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iraq-Ludo-APK
          path: extracted/IraqLudo-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
