
name: Build Iraq Ludo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     
      - name: Extract game project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted


      - name: Build game assets
        working-directory: extracted/IraqLudo-Android
        run: bash web/build.sh

      - name: Build APK
        working-directory: extracted/IraqLudo-Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iraq-Ludo-APK
          path: extracted/IraqLudo-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
